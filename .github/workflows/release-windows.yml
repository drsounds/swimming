name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release -p swimming-bridge --features fastframe
      - uses: actions/upload-artifact@v4
        with:
          name: swimming-windows-x86_64
          path: target/release/swimming.exe
      - name: Publish release binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/swimming.exe
